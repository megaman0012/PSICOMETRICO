# ============================================================
# DESPLIEGUE DE PRODUCCIÓN
#
#   cp .env.example .env          # y configure los secretos
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias vs. docker-compose.yml (desarrollo):
#   - Imágenes multi-stage compiladas (sin node_modules del host,
#     sin bind mounts, sin volúmenes de node_modules).
#   - Backend en NODE_ENV=production (JWT_SECRET con fail-fast real).
#   - Frontend servido como build estático con Nginx.
#   - PostgreSQL solo en la red interna de Docker (no se expone).
# ============================================================
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-psicometrico}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: psicometrico-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-psicometrico}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET es obligatorio. Genérelo con: openssl rand -base64 48}"
      PORT: 3000
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@psicometrico.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_EVALUADOR_EMAIL: ${SEED_EVALUADOR_EMAIL:-evaluador@psicometrico.com}
      SEED_EVALUADOR_PASSWORD: ${SEED_EVALUADOR_PASSWORD:-Evaluador123!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@psicometrico.com}
    ports:
      - "3021:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  frontend:
    image: psicometrico-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3021}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
