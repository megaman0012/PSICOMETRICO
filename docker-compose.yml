services:
  postgres:
    image: postgres:15
    container_name: psicometrico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: psicometrico
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: psicometrico-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/psicometrico?schema=public
      JWT_SECRET: tu_secreto_super_secreto_aqui_cambialo_en_produccion
      PORT: 3000
    ports:
      - "3021:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh /app/docker-entrypoint.sh

  frontend:
    build: ./frontend
    container_name: psicometrico-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3021
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh /app/docker-entrypoint.sh

volumes:
  postgres_data:
